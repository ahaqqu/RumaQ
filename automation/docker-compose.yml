services:
  # Resource bounds (#589): with no caps, one run measured 4.8 core-min of CPU
  # and ~2 GB of memory across 5 containers — enough to pin 4-5 of 8 cores and
  # starve everything else on the machine (same contention class as #304).
  # Every service is sized from the kernel-measured per-container peaks with
  # headroom, so a run throttles instead of taking the host. Bounds also cover
  # the ephemeral `compose run --rm test-runner` containers, which inherit this
  # service definition.
  api:
    build:
      context: ..
      dockerfile: automation/docker/Dockerfile.api
    # Measured: ~1.1 cores sustained, ~0.9 GB memory peak (Miniflare workerd).
    cpus: 1.0
    mem_limit: 768m
    environment:
      - TEST_MODE=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=1000000
      # Login limiter (QA-F4, #499): browser logins carry no X-Forwarded-For,
      # so every e2e scenario shares one bucket and the production budget
      # (10 attempts / 60 s) trips 12 of 47 scenarios. Only the harness raises
      # it — the app default stays 10 / 60 s for production and previews.
      - LOGIN_RATE_MAX=1000000
      # Lets e2e scenarios seed price data through the internal ingest
      # endpoint (tests/local/e2e/features/prices-explorer.feature).
      - HAQITA_INGEST_SECRET=test-ingest-secret
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf --max-time 4 --output /dev/null --write-out "%{http_code}" http://localhost:8787/api/health | grep -q 200',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: automation/docker/Dockerfile.web
    # Static nginx over a prebuilt bundle — a fraction of the api budget.
    cpus: 1.0
    mem_limit: 768m

  proxy:
    # Static reverse proxy: ~0.01 cores and ~10-20 MB measured.
    cpus: 0.25
    mem_limit: 128m
    image: nginx:alpine
    ports:
      # Per-run host port (#511): test-local.sh exports RUMAQ_TEST_PORT before
      # every compose call, so parallel checkouts never fight over 3000. The
      # container port stays 3000 (nginx.proxy.conf) and the test-runner keeps
      # using proxy:3000 on the project network.
      - '${RUMAQ_TEST_PORT:-3000}:3000'
    volumes:
      - ./docker/nginx.proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  test-runner:
    build:
      context: ..
      dockerfile: automation/docker/Dockerfile.test-runner
    # Measured: ~1.25 cores sustained, ~700 MB peak per runner. 2.0 cpus gives
    # the suite the biggest share so caps do not slow it much; 2g mem covers
    # Playwright + Chromium. shm_size replaces the default 64 MB /dev/shm,
    # which Chromium falls back or crashes on once several contexts open —
    # a failure mode that looks like a flaky test.
    cpus: 2.0
    mem_limit: 2g
    shm_size: 1g
    environment:
      - TEST_BASE_URL=http://proxy:3000
    depends_on:
      proxy:
        condition: service_started
    volumes:
      - ./test-results/vitest:/app/vitest-report
      - ./test-results/playwright:/app/playwright-report
      - ./test-results/artifacts:/app/test-results
