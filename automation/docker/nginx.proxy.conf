server {
    listen 3000;
    server_name _;

    # API requests → worker
    location /api/ {
        proxy_pass http://api:8787;
        # $http_host, not $host: keep the client's port so the Worker's own
        # request origin matches the browser's Origin header (ahaqqu/RumaQ#528
        # — the CSRF guard compares the two; with $host the Worker sees
        # http://localhost and rejects the SPA's http://localhost:3000 writes).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the X-Forwarded-* headers set by tests so each scenario keeps
        # its own synthetic IP for rate-limit isolation and the auth handler can
        # reconstruct the public origin for redirect URIs.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }

    # Everything else → SPA
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
