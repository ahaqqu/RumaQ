server {
    listen 3000;
    server_name _;

    # API requests → worker
    location /api/ {
        proxy_pass http://api:8787;
        # $http_host, not $host: keep the client's port so the Worker's own
        # request origin matches the browser's Origin header (ahaqqu/RumaQ#528
        # — the CSRF guard compares the two; with $host the Worker sees
        # http://localhost and rejects the SPA's http://localhost:3000 writes).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the X-Forwarded-* headers set by tests so each scenario keeps
        # its own synthetic IP for rate-limit isolation and the auth handler can
        # reconstruct the public origin for redirect URIs.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
    }

    # Everything else → SPA. `web` is optional (the --api mode runs without the
    # SPA profile), so resolve it at request time through Docker's embedded DNS:
    # nginx would otherwise refuse to start when web does not exist, or keep a
    # stale IP after a web restart. A missing web answers 502 for non-API paths,
    # which the full/e2e gate retries until web is healthy.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $spa_upstream http://web:80;
        proxy_pass $spa_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
