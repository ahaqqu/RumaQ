    const paths={
      search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',book:'<path d="M4 5a3 3 0 0 1 3-2h5v17H7a3 3 0 0 0-3 2V5Zm16 0a3 3 0 0 0-3-2h-5v17h5a3 3 0 0 1 3 2V5Z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4m8-4v4M3 10h18"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="m9 5 7 7-7 7"/>',right:'<path d="M4 12h16m-6-6 6 6-6 6"/>',check:'<path d="m5 12 4 4L19 6"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2"/>',compare:'<path d="M4 7h13m-3-3 3 3-3 3M20 17H7m3-3-3 3 3 3"/>',tag:'<path d="M20 13 11 22 2 13V3h10l8 10Z"/><circle cx="7" cy="8" r="1"/>',shop:'<path d="M3 9h18l-2-5H5L3 9Zm1 0v12h16V9M9 21v-7h6v7"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>'
    };
    const icon=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.check}</svg>`;
    const logo=()=>'<svg class="brand-icon" viewBox="0 0 44 44" aria-label="RumaQ" role="img"><rect x="2" y="2" width="40" height="40" rx="13" fill="currentColor"/><circle cx="20" cy="20" r="10" fill="none" stroke="white" stroke-width="2.6"/><path d="m26 27 7 7" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/><path d="m14.5 20 4 4 7-9" fill="none" stroke="#bce7ce" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const storeMark=(id,name=true)=>{const item=store(id);return `<span class="store" style="--store:${item.color}"><i>${item.short}</i>${name?item.name:''}</span>`};
    const watchButton=id=>`<button type="button" class="watch ${state.watched.has(id)?'active':''}" data-action="watch" data-id="${id}" aria-pressed="${state.watched.has(id)}" aria-label="${state.watched.has(id)?'Berhenti memantau':'Pantau'} ${product(id).name}">${icon('bell')}</button>`;
    const searchBox=()=>`<label class="search">${icon('search')}<span class="sr-only">Cari barang</span><input data-search type="search" value="${esc(state.query)}" placeholder="Mau cari promo apa, Bu?" autocomplete="off">${state.query?`<button type="button" data-action="clear-search" aria-label="Hapus pencarian">${icon('close')}</button>`:''}</label>`;
    const dayStrip=()=>`<div class="days" aria-label="Pilih hari belanja">${days.map(day=>`<button type="button" data-action="day" data-day="${day.id}" class="${state.day===day.id?'selected':''}" aria-pressed="${state.day===day.id}"><span>${day.short}</span><strong>${day.id}</strong>${day.id===14?'<i></i>':''}</button>`).join('')}</div>`;
    const sectionHead=(eyebrow,title,action='',view='')=>`<div class="section-head"><div>${eyebrow?`<span>${eyebrow}</span>`:''}<h2>${title}</h2></div>${action?`<button type="button" data-action="view" data-view="${view}">${action}${icon('right')}</button>`:''}</div>`;
    const productCard=item=>`<article class="product-card"><button type="button" class="card-main" data-action="product" data-id="${item.id}"><div class="card-image"><img src="${item.image}" alt="${item.name}"><span class="discount">-${discount(item)}%</span></div><div class="card-content">${storeMark(item.offers[0][0])}<h3>${item.name}</h3><p>${item.brand} · ${item.unit}</p><div class="card-price"><strong>${money(item.offers[0][1])}</strong><s>${money(item.normal)}</s></div><span class="ends">${icon('calendar')} s.d. ${item.end.split(', ')[1]}</span></div></button><div class="card-watch">${watchButton(item.id)}</div></article>`;
    const productRow=item=>`<article class="product-row"><button type="button" class="row-open" data-action="product" data-id="${item.id}"><span class="row-image"><img src="${item.image}" alt=""></span><span class="row-copy"><strong>${item.name}</strong><small>${item.brand} · ${item.unit}</small>${storeMark(item.offers[0][0])}</span><span class="row-price"><span class="row-discount">-${discount(item)}%</span><s>${money(item.normal)}</s><strong>${money(item.offers[0][1])}</strong><small>Termurah</small></span></button><div class="row-watch">${watchButton(item.id)}</div></article>`;
    function currentProducts(){return products.map(item=>{let offers=item.offers.filter(offer=>state.stores.has(offer[0]));if(!offers.length)offers=item.offers;return {...item,offers:[...offers].sort((a,b)=>a[1]-b[1])}})}
    function homeProducts(){const available=currentProducts().filter(item=>item.days.includes(state.day));const monitored=available.filter(item=>state.watched.has(item.id));return monitored.length?monitored:available}
    function tenangHome(){const list=homeProducts();const total=currentProducts().slice(0,4).reduce((sum,item)=>sum+item.normal-item.offers[0][1],0);return `<div class="view"><header class="app-header">${logo()}<button class="profile" data-action="view" data-view="watch" aria-label="Buka pantauan Ibu Rina">IR</button></header><div class="greeting"><span class="location">${icon('pin')} Jakarta Selatan ${icon('arrow')}</span><h1>Selamat pagi, Ibu Rina 👋</h1><p>Yuk, belanja lebih hemat tanpa repot membandingkan.</p></div>${searchBox()}<section class="savings"><div class="savings-copy"><span>${icon('spark')} POTENSI HEMAT MINGGU INI</span><strong>${money(total)}</strong><p>dari ${products.length} promo kebutuhan dapur</p><button data-action="view" data-view="watch">Lihat pilihan saya ${icon('right')}</button></div><div class="savings-art" aria-hidden="true"><span>🥬</span><span>🍚</span></div></section>${sectionHead('KAPAN MAU BELANJA?','Promo sesuai hari Ibu')}${dayStrip()}${sectionHead(state.watched.size?'DARI PANTAUAN IBU':'PALING BANYAK DILIHAT',state.day===14?'Harga baik untuk Sabtu':'Promo yang masih berlaku','Atur','watch')}<div class="cards-scroll h-scroll">${list.slice(0,4).map(productCard).join('')}</div><button class="brochure-bridge" data-action="view" data-view="catalog"><span>${icon('book')}</span><span><strong>Lebih nyaman lihat katalog?</strong><small>Semua promo sudah kami rapikan per barang.</small></span>${icon('arrow')}</button><div class="trust">${icon('check')} Harga dari katalog supermarket, bukan toko online</div></div>`}
    function ceriaHome(){const list=homeProducts();const lead=list[0]||currentProducts()[0];const total=list.reduce((sum,item)=>sum+item.normal-item.offers[0][1],0);return `<div class="view"><header class="app-header">${logo()}<button class="watch-count" data-action="view" data-view="watch">${icon('bell')} ${state.watched.size}</button></header><div class="ceria-title"><small>IBU PILIH, RUMAQ CARIKAN</small><h1>Cek dulu.<br><span>Baru belanja.</span></h1><p>Harga promo semua supermarket, beres dalam satu tempat.</p></div>${searchBox()}<div class="date-line"><span>Mau belanja hari apa?</span><span class="fresh">Diperbarui 10 menit lalu</span></div>${dayStrip()}<section class="lead-deal"><button data-action="product" data-id="${lead.id}"><div class="lead-image"><img src="${lead.image}" alt="${lead.name}"><span class="burst">-${discount(lead)}%</span></div><div class="lead-content"><div class="deal-label">${icon('tag')} PALING HEMAT HARI INI</div><h2>${lead.name}</h2><p>${lead.brand} · ${lead.unit}</p><div class="ceria-price"><strong>${money(lead.offers[0][1])}</strong><s>${money(lead.normal)}</s></div><div class="lead-store">${storeMark(lead.offers[0][0])}<span>+${lead.offers.length-1} harga lain ${icon('arrow')}</span></div></div></button></section><div class="saving-ribbon"><span>🎉</span><p>Bisa hemat <strong>${money(total)}</strong> kalau pilih harga termurah!</p></div>${sectionHead('HARGA BERSAHABAT','Jangan sampai kelewat','Semua','calendar')}<div class="product-list">${list.slice(1,4).map(productRow).join('')}</div>${sectionHead('BOLAK-BALIK KATALOG','Promo yang lagi ramai','Lihat semua','catalog')}<div class="brochure-grid">${brochures.slice(0,2).map(brochureCard).join('')}</div></div>`}
    function bandinginHome(){const list=homeProducts();const lead=list[0]||currentProducts()[0];const max=lead.offers[lead.offers.length-1][1];return `<div class="view"><header class="app-header">${logo()}<span class="fresh">Diperbarui 10 menit lalu</span></header><div class="bandingin-title"><span class="pill">${icon('compare')} PEMBANDING HARGA PRIBADI</span><h1>Satu barang.<br><span>Semua harga.</span></h1><p>Tak perlu pindah-pindah katalog. Paling murah langsung terlihat.</p></div>${searchBox()}<div class="quick">${['Beras','Minyak','Telur'].map(label=>`<button data-action="quick-search" data-query="${label}">${label}</button>`).join('')}<button data-action="view" data-view="watch">+ Pantau lainnya</button></div><section class="comparison"><div class="comparison-product"><img src="${lead.image}" alt="${lead.name}"><div><small>PILIHAN UNTUK IBU</small><h2>${lead.name}</h2><p>${lead.brand} · ${lead.unit}</p></div>${watchButton(lead.id)}</div><div class="compare-offers">${lead.offers.map((offer,index)=>`<button data-action="product" data-id="${lead.id}" class="${index===0?'best':''}">${storeMark(offer[0])}<span class="bar"><i style="width:${65+(max-offer[1])/Math.max(1,max-lead.offers[0][1])*35}%"></i></span><strong>${money(offer[1])}</strong>${index===0?'<span class="best-tag">TERBAIK</span>':''}</button>`).join('')}</div><button class="compare-detail" data-action="product" data-id="${lead.id}">Lihat perbandingan lengkap ${icon('right')}</button></section>${sectionHead('MASUKKAN RENCANA IBU','Belanja Sabtu? Cek di sini')}${dayStrip()}${sectionHead('REKOMENDASI HARGA BAIK',list.length+' promo pada '+days.find(day=>day.id===state.day).long,'Jadwal','calendar')}<div class="compare-grid">${list.slice(0,4).map(item=>`<article class="compare-card"><button data-action="product" data-id="${item.id}"><div class="image"><img src="${item.image}" alt="${item.name}"><span>${item.offers.length} harga</span></div><h3>${item.name}</h3><p>${item.unit}</p><strong class="price">${money(item.offers[0][1])}</strong>${storeMark(item.offers[0][0])}</button></article>`).join('')}</div><div class="confidence"><span>${icon('check')}</span><p><strong>Harga punya sumber yang jelas.</strong><br>Setiap promo terhubung ke katalog aslinya.</p></div></div>`}
    function brochureCard(item){return `<button class="brochure-card" data-action="brochure" data-id="${item.id}"><span class="brochure-cover" style="--brochure:${item.accent}"><img src="${item.cover}" alt=""><span class="eyebrow">${item.eyebrow}</span><strong>${item.title}</strong><span class="brochure-date">${item.period}</span></span><span class="brochure-meta">${storeMark(item.store)}<span>${item.items.length} barang ${icon('arrow')}</span></span></button>`}
    function catalogView(){const filtered=state.catalogStore?brochures.filter(item=>item.store===state.catalogStore):brochures;return `<div class="view"><div class="view-title"><span>SUMBER PROMO</span><h1>Katalog minggu ini</h1><p>Lihat katalognya, lalu pilih barang tanpa membaca tulisan kecil.</p></div><div class="filters"><button data-action="catalog-filter" data-store="" class="${!state.catalogStore?'active':''}">Semua</button>${stores.map(item=>`<button data-action="catalog-filter" data-store="${item.id}" class="${state.catalogStore===item.id?'active':''}">${item.name}</button>`).join('')}</div><div class="brochure-grid">${filtered.map(brochureCard).join('')}</div><div class="trust">${icon('check')} Harga sudah dirapikan dari hasil baca katalog</div></div>`}
    function calendarView(){const day=days.find(item=>item.id===state.day);const list=currentProducts().filter(item=>item.days.includes(state.day));return `<div class="view"><div class="view-title"><span>RENCANA BELANJA</span><h1>Promo di hari belanja</h1><p>Pilih harinya dulu. RumaQ carikan promo yang masih berlaku.</p></div>${dayStrip()}<div class="calendar-summary"><span>${icon('calendar')}</span><div><small>${day.long}, ${day.id} Juni</small><strong>${list.length} promo bisa Ibu beli</strong></div><span>${state.day===14?'Pilihan Ibu':'Hari ini'}</span></div>${sectionHead('',state.day===14?'Siap untuk belanja Sabtu':'Promo hari '+day.long)}<div class="product-list">${list.map(productRow).join('')}</div><p class="footnote">${icon('pin')} Harga dapat berbeda di tiap cabang. Cek katalog sebelum berangkat.</p></div>`}
    function watchView(){const list=currentProducts();const recommended=state.watched.size?list.filter(item=>state.watched.has(item.id)):[...list].sort((a,b)=>(b.category==='Makanan pokok')-(a.category==='Makanan pokok')||b.views-a.views);return `<div class="view"><div class="view-title"><span>PILIHAN IBU</span><h1>Yang mau dipantau</h1><p>Pilih kebutuhan dan supermarket. Kami carikan harga terbaiknya.</p></div><section class="settings"><div class="settings-title"><span>${icon('shop')}</span><div><h2>Supermarket langganan</h2><p>Bisa pilih lebih dari satu</p></div></div><div class="store-grid">${stores.map(item=>`<button data-action="store" data-id="${item.id}" class="${state.stores.has(item.id)?'selected':''}" aria-pressed="${state.stores.has(item.id)}">${storeMark(item.id,false)}<span>${item.name}</span><b>${state.stores.has(item.id)?icon('check'):''}</b></button>`).join('')}</div></section><section class="settings"><div class="settings-title"><span>${icon('tag')}</span><div><h2>Kebutuhan yang dipantau</h2><p>Tulis umum saja, seperti “beras”</p></div></div><div class="item-chips">${products.map(item=>`<button data-action="watch" data-id="${item.id}" class="${state.watched.has(item.id)?'selected':''}" aria-pressed="${state.watched.has(item.id)}">${state.watched.has(item.id)?icon('check'):'+'} ${item.name.replace(' premium','').replace(' segar','')}</button>`).join('')}</div></section>${sectionHead(state.watched.size?state.watched.size+' BARANG DIPANTAU':'PALING BANYAK DILIHAT',state.watched.size?'Rekomendasi untuk Ibu':'Makanan pokok lebih dulu')}<div class="product-list">${recommended.map(productRow).join('')}</div></div>`}
    function searchResults(){const query=state.query.trim().toLocaleLowerCase('id');const list=currentProducts().filter(item=>[item.name,item.brand,item.category].join(' ').toLocaleLowerCase('id').includes(query));return `<div class="view"><header class="app-header">${logo()}<span class="fresh">${list.length} hasil</span></header>${searchBox()}${sectionHead('PENCARIAN HARGA','Hasil untuk “'+esc(state.query)+'”')}${list.length?`<div class="product-list">${list.map(productRow).join('')}</div>`:`<div class="empty"><span>${icon('search')}</span><h2>Belum ketemu, Bu</h2><p>Coba kata yang lebih sederhana, misalnya “beras”, “minyak”, atau “kentang”.</p></div>`}</div>`}
    function bottomNav(){const items=[['home','home','Beranda'],['catalog','book','Katalog'],['calendar','calendar','Jadwal'],['watch','bell','Pantauan']];return `<nav class="bottom-nav" aria-label="Navigasi prototipe">${items.map(([id,iconName,label])=>`<button data-action="view" data-view="${id}" class="${state.view===id?'active':''}" aria-current="${state.view===id?'page':'false'}"><span>${icon(iconName)}${id==='watch'&&state.watched.size?`<i>${state.watched.size}</i>`:''}</span><small>${label}</small></button>`).join('')}</nav>`}
    function productSheet(item){const cheapest=item.offers[0];const source=brochures.find(entry=>entry.store===cheapest[0]&&entry.items.includes(item.id))||brochures.find(entry=>entry.items.includes(item.id));return `<div class="sheet-layer"><button class="sheet-scrim" data-action="close" aria-label="Tutup"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="Perbandingan harga ${item.name}"><button class="sheet-close" data-action="close" aria-label="Tutup detail">${icon('close')}</button><div class="sheet-hero"><img src="${item.image}" alt="${item.name}"><span class="discount">HEMAT ${discount(item)}%</span></div><div class="sheet-body"><div class="sheet-title"><div><span>${item.category}</span><h2>${item.name}</h2><p>${item.brand} · ${item.unit}</p></div>${watchButton(item.id)}</div><div class="best-price"><div><span>Harga termurah</span><strong>${money(cheapest[1])}</strong><small><s>${money(item.normal)}</s> · Hemat ${money(item.normal-cheapest[1])}</small></div>${storeMark(cheapest[0],false)}</div><div class="sheet-section"><h3>Bandingkan di ${item.offers.length} supermarket</h3>${icon('compare')}</div><div class="offers">${item.offers.map((offer,index)=>`<div class="offer ${index===0?'best':''}">${storeMark(offer[0])}${index===0?`<span class="cheapest">${icon('check')} Paling murah</span>`:`<span class="difference">+${money(offer[1]-cheapest[1])}</span>`}<strong>${money(offer[1])}</strong></div>`).join('')}</div><div class="validity">${icon('calendar')}<div><span>Promo berlaku sampai</span><strong>${item.end}</strong></div></div><button class="primary" data-action="brochure" data-id="${source.id}">${icon('book')} Lihat di katalog asli ${icon('arrow')}</button><p class="source-note">Harga dibaca dari katalog promo · Diperbarui 10 menit lalu</p></div></section></div>`}
    function brochureSheet(item){return `<div class="sheet-layer"><button class="sheet-scrim" data-action="close" aria-label="Tutup"></button><section class="sheet" role="dialog" aria-modal="true" aria-label="${item.title}"><button class="sheet-close" data-action="close" aria-label="Tutup katalog">${icon('close')}</button><div class="brochure-hero" style="--brochure:${item.accent}"><img src="${item.cover}" alt=""><div><span>${item.eyebrow}</span><h2>${item.title}</h2><p>${store(item.store).name} · ${item.period}</p></div></div><div class="sheet-body"><div class="parsed"><span>${icon('check')}</span><div><strong>Sudah dibaca jadi daftar belanja</strong><p>${item.items.length} contoh produk dari katalog ini</p></div></div><div class="sheet-section"><h3>Barang promo di katalog</h3><span>Harga ${store(item.store).name}</span></div><div class="parsed-list">${item.items.map(id=>{const entry=product(id);const offer=entry.offers.find(offer=>offer[0]===item.store)||entry.offers[0];const off=Math.round((1-offer[1]/entry.normal)*100);return `<button data-action="product" data-id="${id}"><img src="${entry.image}" alt=""><span><strong>${entry.name}</strong><small>${entry.unit} · ${entry.brand}</small></span><span><strong>${money(offer[1])}</strong><small>-${off}%</small></span>${icon('arrow')}</button>`}).join('')}</div><p class="source-note">Katalog asli tersimpan untuk mengecek kembali harga dan periode promo.</p></div></section></div>`}
    function render(reset=false,focusSearch=false){const screen=document.getElementById('screen');screen.className='screen '+state.theme;let content='';if(state.query.trim())content=searchResults();else if(state.view==='home')content=state.theme==='tenang'?tenangHome():state.theme==='ceria'?ceriaHome():bandinginHome();else if(state.view==='catalog')content=catalogView();else if(state.view==='calendar')content=calendarView();else content=watchView();let modal='';if(state.modal?.type==='product')modal=productSheet(currentProducts().find(item=>item.id===state.modal.id));if(state.modal?.type==='brochure')modal=brochureSheet(brochure(state.modal.id));screen.innerHTML=`<main class="app-scroll">${content}</main>${bottomNav()}${modal}`;if(reset)screen.querySelector('.app-scroll').scrollTop=0;document.querySelectorAll('[data-action="theme"]').forEach(button=>{const active=button.dataset.theme===state.theme;button.classList.toggle('active',active);button.setAttribute('aria-pressed',active)});const concept=concepts[state.theme];document.getElementById('mobile-number').textContent=concept.number+' / 03';document.getElementById('mobile-name').textContent=concept.name;document.getElementById('notes').innerHTML=`<div class="note-logo ${state.theme}">${logo()}</div><span class="note-number">KONSEP ${concept.number}</span><h1>${concept.name}</h1><h2>${concept.tag}</h2><p>${concept.description}</p><div class="palette">${concept.colors.map(color=>`<span style="background:${color}" title="${color}"></span>`).join('')}</div><div class="strengths">${concept.strengths.map(text=>`<span>${icon('check')} ${text}</span>`).join('')}</div>`;if(state.modal)screen.querySelector('.sheet-close')?.focus();if(focusSearch){const input=screen.querySelector('[data-search]');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length)}}}
    document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(action==='theme'){state.theme=button.dataset.theme;state.view='home';state.day=14;state.query='';state.modal=null;render(true)}else if(action==='view'){state.view=button.dataset.view;state.query='';state.modal=null;render(true)}else if(action==='day'){state.day=Number(button.dataset.day);render()}else if(action==='product'){state.modal={type:'product',id:button.dataset.id};render()}else if(action==='brochure'){state.modal={type:'brochure',id:button.dataset.id};render()}else if(action==='close'){state.modal=null;render()}else if(action==='watch'){const id=button.dataset.id;state.watched.has(id)?state.watched.delete(id):state.watched.add(id);render()}else if(action==='store'){const id=button.dataset.id;state.stores.has(id)?state.stores.delete(id):state.stores.add(id);render()}else if(action==='catalog-filter'){state.catalogStore=button.dataset.store||null;render()}else if(action==='clear-search'){state.query='';render(true)}else if(action==='quick-search'){state.query=button.dataset.query;render(false,true)}});
    document.addEventListener('input',event=>{if(event.target.matches('[data-search]')){state.query=event.target.value;render(false,true)}});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal=null;render()}});
    document.getElementById('gallery-logo').innerHTML=logo();
    render();
  </script>
</body>
</html>
