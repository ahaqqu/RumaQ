name: Test Automation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The readiness gate has its own 180 s budget, but a cold image build plus
    # the full suite (and Playwright's first install on a fresh runner) needs
    # headroom. A stuck run must fail in minutes, not burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Run integration & E2E tests via Docker
        run: ./scripts/github/test-automation.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: automation/test-results/playwright/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: automation/test-results/
