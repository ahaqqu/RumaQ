name: Test Automation

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The readiness gate has its own 180 s budget, but a cold image build plus
    # the full suite (and Playwright's first install on a fresh runner) needs
    # headroom. A stuck run must fail in minutes, not burn the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # #657 phase 2: reuse main's digest-keyed GHCR images when they exist —
      # the toolchain build (~2-3 min) is skipped, the Compose cold-build
      # remains the fallback (fail-open; a miss must look like yesterday).
      - name: Pull toolchain images from GHCR when they exist
        run: ./scripts/github/pull-test-images.sh
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Run integration & E2E tests via Docker
        run: ./scripts/github/test-automation.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Reports are per-run (tests/results/runs/<run-id>/playwright), so two
          # runs on one runner never overwrite each other.
          path: automation/test-results/runs/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: automation/test-results/
