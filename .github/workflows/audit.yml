name: Daily Vulnerability Audit

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      prod_vulns: ${{ steps.prod.outputs.vulns_found }}
      all_vulns: ${{ steps.all.outputs.vulns_found }}
      fixable: ${{ steps.try_fix.outputs.fixable }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Check production vulnerabilities
        id: prod
        run: |
          if bun audit --severity=low --omit=dev &>/dev/null; then
            echo "vulns_found=false" >> $GITHUB_OUTPUT
          else
            echo "vulns_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Check all vulnerabilities
        id: all
        run: |
          if bun audit --severity=low &>/dev/null; then
            echo "vulns_found=false" >> $GITHUB_OUTPUT
          else
            echo "vulns_found=true" >> $GITHUB_OUTPUT
            bun audit --severity=low 2>&1 | tee /tmp/audit.txt
          fi

      - name: Close resolved issues
        if: steps.prod.outputs.vulns_found == 'false' && steps.all.outputs.vulns_found == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const api = { headers: { 'X-GitHub-Api-Version': '2022-11-28' } }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              per_page: 100,
              ...api,
            })

            const stale = issues.filter(i => i.title.startsWith('Vulnerabilities require manual fix'))
            for (const issue of stale) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
                ...api,
              })
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '`bun audit --severity=low` now passes — resolved. Closing.',
                ...api,
              })
            }
            console.log(`Closed ${stale.length} resolved issue(s)`)

      - name: Attempt safe fix
        id: try_fix
        if: steps.prod.outputs.vulns_found == 'true' || steps.all.outputs.vulns_found == 'true'
        run: |
          bun update --latest 2>&1 || true
          if bun audit --severity=low &>/dev/null; then
            echo "fixable=true" >> $GITHUB_OUTPUT
          else
            echo "fixable=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.try_fix.outputs.fixable == 'true'
        run: ./scripts/test.sh unit 2>&1

      - name: Create PR
        if: steps.try_fix.outputs.fixable == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: automated vulnerability patch'
          title: 'fix: automated vulnerability fixes'
          body: |
            ## Automated security fix

            `bun update` resolved all vulnerabilities. Tests pass.

            _Generated by [Daily Vulnerability Audit](${{ github.server_url }}/${{ github.repository }}/actions/workflows/audit.yml)._
          branch: automation/vulnerability-fix
          base: main
          labels: security

      - name: Create issue (needs manual fix)
        if: steps.all.outputs.vulns_found == 'true' && steps.try_fix.outputs.fixable == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const api = { headers: { 'X-GitHub-Api-Version': '2022-11-28' } }
            const today = new Date().toISOString().slice(0, 10)
            const title = `Vulnerabilities require manual fix — ${today}`

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
              ...api,
            })

            if (issues.some(i => i.title === title)) {
              console.log('Issue already exists, skipping')
              return
            }

            const fs = require('fs')
            const report = fs.readFileSync('/tmp/audit.txt', 'utf8')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: '## Vulnerabilities require manual fix\n\n' +
                    '`bun update` could not resolve all vulnerabilities without breaking changes.\n\n' +
                    '**Action needed:** Review and fix manually.\n\n```\n' + report + '\n```\n\n' +
                    '_Generated by [Daily Vulnerability Audit](' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/workflows/audit.yml)._' ,
              labels: ['security'],
              ...api,
            })
