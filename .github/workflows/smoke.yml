name: Production Smoke

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Run production smoke tests
        run: ./scripts/github/smoke.sh
        env:
          RUMAQ_PROD_SESSION: ${{ secrets.RUMAQ_PROD_SESSION }}

      - name: Close resolved issues
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const api = { headers: { 'X-GitHub-Api-Version': '2022-11-28' } }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-failure',
              per_page: 100,
              ...api,
            })

            const stale = issues.filter(i => i.title.startsWith('Smoke test failure'))
            for (const issue of stale) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
                ...api,
              })
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Production smoke tests now pass — resolved. Closing.',
                ...api,
              })
            }
            console.log(`Closed ${stale.length} resolved issue(s)`)

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const api = { headers: { 'X-GitHub-Api-Version': '2022-11-28' } }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'smoke-failure',
              state: 'open',
              ...api,
            })

            const now = new Date().toISOString().slice(0, 10)
            const title = `Smoke test failure — ${now}`
            const existing = issues.find(i => i.title === title)

            if (existing) {
              console.log(`Issue #${existing.number} already exists`)
              return
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Production smoke tests failed.\n\n[View failed run](${runUrl})\n\n**Action required:** Investigate the failure and fix or acknowledge.`,
              labels: ['smoke-failure'],
              ...api,
            })
