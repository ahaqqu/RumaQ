name: Publish test images

# Publishes the digest-keyed toolchain test images to GHCR (#657 phase 2):
# ghcr.io/ahaqqu/rumaq-test-{api,web,test-runner}:<toolchain digest>. PR
# smoke jobs and the nightly then pull these instead of cold-building ~2-3
# min of Docker (see scripts/github/pull-test-images.sh).
#
# On main pushes so warm images exist as soon as a toolchain-touching change
# (lockfile, Dockerfile, config) merges — a digest-bumping PR opened right
# after is the miss case and falls back to a cold build. workflow_dispatch
# covers backfills. Skip-if-exists makes re-runs cheap; concurrency queues
# two pushes instead of racing them (identical layers, but one build is
# enough).
#
# PRs never run this workflow: untrusted PR code must not mint packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-test-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Cold build measured ~165 s for api+web and ~86 s for the test-runner
    # (run 43615374695); 20 min covers a slow runner with headroom. A stuck
    # job must fail, not burn the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish digest-keyed toolchain images (skip if present)
        run: ./scripts/github/publish-test-images.sh
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
