name: CI

# Pull-request gate. Pushes to main are checked and deployed by
# .github/workflows/deploy.yml instead, so PRs never show a deploy job.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bash ./scripts/github/ci.sh
        env:
          # Exact base tree for the worker-smoke scope diff (worker-smoke-scope.sh).
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      # The test scripts print failures only; the full output is in these logs.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test-results/*.log
          if-no-files-found: ignore

      # ci.sh leaves frontend/dist behind; audit it against the phase-09
      # performance (>= 0.7) and accessibility (>= 0.9) budgets. A change set
      # that cannot reach that bundle (docs, backend, contract, codegen tools,
      # most scripts) skips the audit. The gate lives here, not in ci.sh,
      # because only PR CI runs Lighthouse — the main-push ci job in
      # deploy.yml never does. The rule is offline-tested in
      # scripts/test/lighthouse-scope.sh (run in ci.sh, audit S3) and it
      # fails safe: an unavailable change set runs the audit. The verdict is
      # consumed as a word, not an exit code: an errored gate fails the step
      # instead of reading as a skip (audit M1).
      - id: lighthouse-scope
        name: Check if Lighthouse CI is needed
        env:
          # Exact base tree for the change-set diff (changed-paths.sh).
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          verdict="$(bash ./scripts/github/lighthouse-scope.sh)" || {
            echo "lighthouse-scope gate errored"
            exit 1
          }
          echo "lighthouse-scope: $verdict"
          verdict_word="${verdict%%[[:space:]]*}"
          case "$verdict_word" in
            run)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            skip)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Lighthouse CI: skipped for this change set"
              ;;
            *)
              echo "unknown lighthouse-scope verdict: $verdict"
              exit 1
              ;;
          esac

      - name: Lighthouse CI (performance + accessibility budgets)
        if: steps.lighthouse-scope.outputs.run == 'true'
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
