name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bash ./scripts/github/ci.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Sequential, not cancel-in-progress: a cancelled deploy followed by a
      # docs-only push would skip its own deploy and the earlier code change
      # would never ship. Queued runs make the changed-files check safe.
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        # Full history so git can diff against github.event.before.
        with:
          fetch-depth: 0

      - id: changes
        name: Check if deploy is needed
        run: |
          needs=$(bash ./scripts/github/needs-deploy.sh \
            "${{ github.event.before }}" "${{ github.sha }}")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
          echo "Deploy needed: $needs"

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.needs == 'true'
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.needs == 'true'

      - name: Deploy production
        if: steps.changes.outputs.needs == 'true'
        run: bash ./scripts/deploy.sh cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}
          HAQITA_INGEST_SECRET: ${{ secrets.HAQITA_INGEST_SECRET }}
