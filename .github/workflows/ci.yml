name: CI

# Pull-request gate. Pushes to main are checked and deployed by
# .github/workflows/deploy.yml instead, so PRs never show a deploy job.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # The ubuntu-24.04 runner image does not ship poppler-utils; without
      # this the scraper's live pdftoppm render tests (test/util/pdf.test.ts)
      # would skip in every CI run and the real render path — spawn args,
      # page naming, ordering, -l budget — would ship CI-untested.
      - name: Install poppler-utils (scraper live pdftoppm tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - run: bash ./scripts/github/ci.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      # ci.sh leaves frontend/dist behind; audit it against the phase-09
      # performance (>= 0.7) and accessibility (>= 0.9) budgets.
      - name: Lighthouse CI (performance + accessibility budgets)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
