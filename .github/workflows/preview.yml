name: Preview deployment

on:
  pull_request:
    branches: [main]
    # Only run on PR open. Redeploys after new pushes must be triggered
    # manually via workflow_dispatch to stay within the Cloudflare Pages free
    # build quota.
    types: [opened]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    # Skip draft PRs to avoid deploying incomplete work.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Verify Cloudflare secrets
        run: |
          missing=""
          for var in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_DATABASE_ID CLOUDFLARE_PREVIEW_DATABASE_ID CLOUDFLARE_API_TOKEN; do
            val="${!var}"
            if [[ -z "$val" ]]; then
              missing="$missing $var"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "Error: missing required secrets:$missing"
            echo "Add them at Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_PREVIEW_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Add global Bun binaries to PATH
        run: echo "/home/runner/.bun/bin" >> "$GITHUB_PATH"

      - name: Deploy branch Worker and Pages preview
        id: deploy
        run: |
          BRANCH_NAME="${{ github.head_ref }}" \
          CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
          CLOUDFLARE_DATABASE_ID="${{ secrets.CLOUDFLARE_PREVIEW_DATABASE_ID }}" \
          CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          PAGES_PROJECT_NAME="${{ vars.PAGES_PROJECT_NAME || 'rumaq' }}" \
          D1_DATABASE_NAME="${{ vars.D1_DATABASE_NAME || 'rumaq-preview' }}" \
          R2_BUCKET_NAME="${{ vars.R2_BUCKET_NAME || 'rumaq-receipts' }}" \
            bash ./scripts/deploy.sh cloudflare
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref
            const sanitized = branch.replace(/[^a-zA-Z0-9-]/g, '-')
            const workerName = `rumaq-api-${sanitized}`
            const workerUrl = `https://${workerName}.rumaq.workers.dev`
            const previewUrl = `https://${sanitized}.rumaq.pages.dev`

            const body = `## Preview deployment ready\n\n` +
              `- **Frontend:** ${previewUrl}\n` +
              `- **API Worker:** ${workerUrl}\n` +
              `- **Health check:** ${workerUrl}/api/health\n\n` +
              `_This preview environment is automatically deleted when the PR is closed._`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            })

            const existing = comments.find(c =>
              c.body.startsWith('## Preview deployment ready')
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
            }
