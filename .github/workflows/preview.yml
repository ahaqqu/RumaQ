name: Preview deployment

on:
  # Deployed on demand only: run from Actions > Preview deployment > Run
  # workflow, selecting the branch to preview. Docs-only or trivial PRs need
  # no preview environment. The branch Worker is still deleted automatically
  # when the PR is closed (cleanup-branch.yml).
  workflow_dispatch:

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Verify Cloudflare secrets
        run: |
          missing=""
          for var in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_DATABASE_ID CLOUDFLARE_PREVIEW_DATABASE_ID CLOUDFLARE_API_TOKEN; do
            val="${!var}"
            if [[ -z "$val" ]]; then
              missing="$missing $var"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "Error: missing required secrets:$missing"
            echo "Add them at Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_PREVIEW_DATABASE_ID: ${{ secrets.CLOUDFLARE_PREVIEW_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Add global Bun binaries to PATH
        run: echo "/home/runner/.bun/bin" >> "$GITHUB_PATH"

      - name: Deploy branch Worker (app + API)
        id: deploy
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}" \
          CLOUDFLARE_ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
          CLOUDFLARE_DATABASE_ID="${{ secrets.CLOUDFLARE_PREVIEW_DATABASE_ID }}" \
          CLOUDFLARE_API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          D1_DATABASE_NAME="${{ vars.D1_DATABASE_NAME || 'rumaq-preview' }}" \
          R2_BUCKET_NAME="${{ vars.R2_BUCKET_NAME || 'rumaq-receipts' }}" \
            bash ./scripts/deploy.sh cloudflare
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v9
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const workerName = `rumaq-api-${branch.replace(/[^a-zA-Z0-9-]/g, '-')}`
            const previewUrl = `https://${workerName}.rumaq.workers.dev`

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            })
            const pr = prs.find(p => p.head.ref === branch)
            if (!pr) {
              console.log(`No open PR found for branch "${branch}"; skipping preview comment.`)
              return
            }

            const body = `## Preview deployment ready\n\n` +
              `- **App + API (single Worker):** ${previewUrl}\n` +
              `- **Health check:** ${previewUrl}/api/health\n\n` +
              `_This preview environment is automatically deleted when the PR is closed._`

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              headers: { 'X-GitHub-Api-Version': '2022-11-28' },
            })

            const existing = comments.find(c =>
              c.body.startsWith('## Preview deployment ready')
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              })
            }
