name: Deploy production

# Commit-based production deploy for pushes to main, plus manual redeploys
# (Actions > Deploy production > Run). CI runs as the first job of this
# workflow so the deploy is natively gated (`needs: ci`) and both checks show
# on the commit. Pull requests never run this workflow — they use ci.yml —
# so no deploy check appears there at all.
#
# Two targets, each with its own path filter (needs-deploy.sh):
#   deploy      — the Cloudflare Worker (everything except docs/workflows)
#   deploy-vps  — the scraper box (scraper/, contract/, deploy plumbing);
#                 opt-in via vars.VPS_HOST until the box is provisioned
#                 (scraper/provision/vps/apply.sh)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Sequential, not cancel-in-progress: a deploy cancelled mid-flight could
  # leave partial secret updates or a half-shipped tree. Queued runs are
  # safe, and a run dropped beyond GitHub's one-pending limit self-heals
  # because the docs-skip check diffs against the last successful deploy's
  # commit.
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bash ./scripts/github/ci.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        # Full history so git can diff against the last deployed commit.
        with:
          fetch-depth: 0

      - id: changes
        name: Check if deploy is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            base=""
          else
            # Diff against the last commit that actually shipped, not the
            # previous push: docs-only pushes and dropped queued runs then
            # never hide a pending code change.
            base=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          fi
          needs=$(bash ./scripts/github/needs-deploy.sh \
            "${base:-0000000000000000000000000000000000000000}" \
            "$(git rev-parse HEAD)")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
          echo "Deploy needed: $needs"

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.needs == 'true'
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.needs == 'true'

      - name: Deploy production
        if: steps.changes.outputs.needs == 'true'
        run: bash ./scripts/deploy.sh cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}
          HAQITA_INGEST_SECRET: ${{ secrets.HAQITA_INGEST_SECRET }}

  deploy-vps:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    # Opt-in until the box is provisioned: an unset VPS_HOST skips this job
    # (visible as a skip on the commit) exactly like ci.sh skips Worker
    # validation without CLOUDFLARE_API_TOKEN. A SET host with anything else
    # missing fails by name in the Require step below — never a silent
    # default destination.
    if: vars.VPS_HOST != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the deploy access
        run: |
          test -n "$VPS_HOST" || { echo "::error::vars.VPS_HOST is unset"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::vars.VPS_USER is unset"; exit 1; }
          test -n "$VPS_ROOT" || { echo "::error::vars.VPS_ROOT is unset — the deploy has no tree to ship to"; exit 1; }
          test -n "$SSH_KEY" || { echo "::error::secrets.VPS_DEPLOY_SSH_KEY is unset — the runner has no key to reach the box"; exit 1; }
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_ROOT: ${{ vars.VPS_ROOT }}
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

      - name: Write the SSH key
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 0600 ~/.ssh/id_deploy
          {
            echo "Host $VPS_HOST"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}

      - id: vps-changes
        name: Check if the VPS deploy is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            base=""
          else
            base=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          fi
          needs=$(bash ./scripts/github/needs-deploy.sh \
            "${base:-0000000000000000000000000000000000000000}" \
            "$(git rev-parse HEAD)" vps)
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
          echo "VPS deploy needed: $needs"

      - uses: oven-sh/setup-bun@v2
        if: steps.vps-changes.outputs.needs == 'true'
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
        if: steps.vps-changes.outputs.needs == 'true'

      - name: Deploy the scraper to the VPS
        if: steps.vps-changes.outputs.needs == 'true'
        run: bash ./scripts/deploy.sh vps
        env:
          RUMAQ_VPS_HOST: ${{ vars.VPS_HOST }}
          RUMAQ_VPS_USER: ${{ vars.VPS_USER }}
          RUMAQ_VPS_ROOT: ${{ vars.VPS_ROOT }}
