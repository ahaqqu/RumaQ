name: Deploy production

# Commit-based production deploy for pushes to main, plus manual redeploys
# (Actions > Deploy production > Run). CI runs as the first job of this
# workflow so the deploy is natively gated (`needs: ci`) and both checks show
# on the commit. Pull requests never run this workflow — they use ci.yml —
# so no deploy check appears there at all.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Sequential, not cancel-in-progress: a deploy cancelled mid-flight could
  # leave partial secret updates. Queued runs are safe, and a run dropped
  # beyond GitHub's one-pending limit self-heals because the docs-skip check
  # diffs against the last successful deploy's commit.
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bash ./scripts/github/ci.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        # Full history so git can diff against the last deployed commit.
        with:
          fetch-depth: 0

      - id: changes
        name: Check if deploy is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            base=""
          else
            # Diff against the last commit that actually shipped, not the
            # previous push: docs-only pushes and dropped queued runs then
            # never hide a pending code change.
            base=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          fi
          needs=$(bash ./scripts/github/needs-deploy.sh \
            "${base:-0000000000000000000000000000000000000000}" \
            "$(git rev-parse HEAD)")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
          echo "Deploy needed: $needs"

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.needs == 'true'
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.needs == 'true'

      - name: Deploy production
        if: steps.changes.outputs.needs == 'true'
        run: bash ./scripts/deploy.sh cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}
          HAQITA_INGEST_SECRET: ${{ secrets.HAQITA_INGEST_SECRET }}
