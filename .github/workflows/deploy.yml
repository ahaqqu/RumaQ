name: Deploy production

# Commit-based production deploy. Runs after CI succeeds on a push to main,
# and on demand (Actions > Deploy production > Run) for manual redeploys.
# Kept in its own workflow without a pull_request trigger so PR checks never
# show a skipped deploy job.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Sequential, not cancel-in-progress: a cancelled deploy followed by a
  # docs-only push would skip its own deploy and the earlier code change
  # would never ship. Queued runs make the changed-files check safe.
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # For workflow_run events github.sha is not the triggering commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history so git can diff against the last deployed commit.
          fetch-depth: 0

      - id: changes
        name: Check if deploy is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            base=""
          else
            # Diff against the last commit that actually shipped, not the
            # previous push: docs-only pushes and dropped queued runs then
            # never hide a pending code change.
            base=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
          fi
          needs=$(bash ./scripts/github/needs-deploy.sh \
            "${base:-0000000000000000000000000000000000000000}" \
            "$(git rev-parse HEAD)")
          echo "needs=$needs" >> "$GITHUB_OUTPUT"
          echo "Deploy needed: $needs"

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.needs == 'true'
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.needs == 'true'

      - name: Deploy production
        if: steps.changes.outputs.needs == 'true'
        run: bash ./scripts/deploy.sh cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          WORKER_JWT_SECRET: ${{ secrets.WORKER_JWT_SECRET }}
          WORKER_ENCRYPTION_KEY: ${{ secrets.WORKER_ENCRYPTION_KEY }}
          HAQITA_INGEST_SECRET: ${{ secrets.HAQITA_INGEST_SECRET }}
